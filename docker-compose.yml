services:

  postgres:
    image: postgres:18

    container_name: bookmanager-postgres


    environment:
      POSTGRES_DB: bookmanager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Di@s1988


    ports:
      - "5432:5432"


    volumes:
      - postgres-data:/var/lib/postgresql/data


    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d bookmanager"
        ]

      interval: 10s

      timeout: 5s

      retries: 5


    restart: always





  backend:

    build:
      context: ./backend


    container_name: bookmanager-backend



    depends_on:
      postgres:
        condition: service_healthy



    environment:

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bookmanager

      SPRING_DATASOURCE_USERNAME: postgres

      SPRING_DATASOURCE_PASSWORD: Di@s1988

      APP_SWAGGER_LAUNCH: false



    ports:
      - "8080:8080"



    restart: always





volumes:

  postgres-data: