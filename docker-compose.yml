name: bookmanager

services:

  postgres:
    image: postgres:18
    container_name: bookmanager-postgres

    environment:
      POSTGRES_DB: bookmanager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d bookmanager"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  backend:
    image: bookmanager-backend

    build:
      context: ./backend

    container_name: bookmanager-backend

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bookmanager
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      APP_SWAGGER_LAUNCH: false

    ports:
      - "8080:8080"

    restart: unless-stopped

  frontend:
    image: bookmanager-frontend

    build:
      context: ./frontend

    container_name: bookmanager-frontend

    depends_on:
      - backend

    ports:
      - "5173:80"

    restart: unless-stopped

volumes:
  postgres-data: